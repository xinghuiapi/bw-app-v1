name: flutter_ui_project
description: High fidelity Flutter UI conversion project
publish_to: 'none'
version: 1.0.0+4
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.2.4
  go_router: ^13.2.0
  provider: ^6.1.2
  easy_localization: ^3.0.8
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  web: ^1.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
